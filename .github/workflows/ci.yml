name: CI

on:
  push:
    branches: [main]
    # Version tags publish semver images; see the publish job.
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, vet & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache defaults to true and keys off go.sum, so module downloads are
      # reused between runs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # Gated on the test job: a red suite means the image is never even built, let
  # alone published. The image is built here from the commit under test rather
  # than pulled, so what is smoke-tested is what CI is looking at.
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t askweb:smoke .

      - name: Smoke-test the container
        run: scripts/smoke-test.sh askweb:smoke

  # Gated on both the suite and the smoke test: the registry never carries an
  # image that did not pass its own smoke test on the commit it was built from.
  #
  # One job builds both architectures. Go cross-compiles, so the Dockerfile
  # varies GOARCH off BuildKit's TARGETARCH and no emulator is involved; the two
  # are published as a single manifest list, so an operator pulls one tag and
  # gets the right one. Revisit if a dependency ever introduces cgo.
  publish:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: [test, smoke]

    permissions:
      contents: read
      # The workflow-level floor is read-only; pushing to ghcr.io needs this.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A pull request builds but publishes nothing, so it never needs to log in
      # — and a fork's token could not anyway.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
